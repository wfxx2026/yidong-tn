        bgColor: '#e3f2fd',
        format: 'number'
    }

  { id: 7, name: '张三河' },
  { id: 8, name: '解怡通' },
  { id: 9, name: '才权' },
  { id: 10, name: '张逸凡' },
  { id: 11, name: '张善钧' },
  { id: 12, name: '钟鑫' },
  { id: 13, name: '李康' },
  { id: 14, name: '肖博' },
  { id: 15, name: '唐凯' },
  { id: 16, name: '刘新龙' },
  { id: 17, name: '李庚' },
  { id: 18, name: '申东波' },
  { id: 19, name: '王贝' },
  { id: 20, name: '苏航航' },
  { id: 21, name: '解庚申' },
  { id: 22, name: '王栋梁' },
  { id: 23, name: '张国龙' },
  { id: 24, name: '杨凯' },
  { id: 25, name: '吕亚杰' },
  { id: 26, name: '郝海瑞' },
  { id: 27, name: '赵重虎' },
  { id: 28, name: '屈耀东' },
  { id: 29, name: '曾亮' },

  { id: 31, name: '王杰' },
  { id: 32, name: '阮小伟' },
  { id: 33, name: '项宇' },

let students = JSON.parse(localStorage.getItem('yidong_training_students')) || JSON.parse(JSON.stringify(DEFAULT_STUDENTS));

function init() { renderTable(); }

function renderTable() {
    const thead = document.getElementById('tableHead');
    let headerHTML = '<tr><th class="sticky-col">序号</th><th class="sticky-col-2">姓名</th><th class="sticky-col-3">项目</th>';
    let lastMonth = 0;
    dates.forEach((d, i) => {
        const monthClass = d.month !== lastMonth ? 'month-divider' : '';
        const weekendClass = d.isWeekend ? 'weekend-header' : '';
        const todayClass = d.isToday ? 'today-highlight' : '';
        headerHTML += `<th class="date-header ${monthClass} ${weekendClass} ${todayClass}" title="${d.date} 星期${d.weekday}"><div class="day-num">${d.day}</div><div class="weekday">${d.weekday}</div></th>`;
        lastMonth = d.month;
    });
    headerHTML += '</tr>';
    thead.innerHTML = headerHTML;
    renderBody();
}

function renderBody() {
    const tbody = document.getElementById('tableBody');
    let bodyHTML = '';
    
    students.forEach((student, idx) => {
        // 2公里跑行
        bodyHTML += '<tr>';
        bodyHTML += `<td class="sticky-col" rowspan="3">${idx + 1}</td>`;
        bodyHTML += `<td class="sticky-col-2 student-name" rowspan="3"><input type="text" value="${student.name}" onchange="updateName(${student.id}, this.value)" placeholder="姓名" title="${student.name}"></td>`;
        bodyHTML += `<td class="sticky-col-3" style="color:#155724;font-weight:bold;">🏃 跑</td>`;
        dates.forEach((d, di) => {
            const cellKey = `${student.id}_${d.date}_run`;
            const value = trainingData[cellKey];
            const weekendClass = d.isWeekend ? 'weekend' : '';
            const todayClass = d.isToday ? 'today-highlight' : '';
            const hasDataClass = value !== undefined ? 'has-data' : '';
            const display = value !== undefined ? formatTime(value) : '';
            bodyHTML += `<td class="training-cell ${weekendClass} ${todayClass} ${hasDataClass}" onclick="openSlider('${cellKey}', 'run', '${student.name}', '${d.date}')" title="${student.name || '学员'+(idx+1)} ${d.date} 2公里跑"><div class="cell-content">${display}</div></td>`;
        });
        bodyHTML += '</tr>';
        
        // 爬绳行
        bodyHTML += '<tr>';
        bodyHTML += `<td class="sticky-col-3" style="color:#856404;font-weight:bold;">🧗 绳</td>`;
        dates.forEach((d, di) => {
            const cellKey = `${student.id}_${d.date}_rope`;
            const value = trainingData[cellKey];
            const weekendClass = d.isWeekend ? 'weekend' : '';
            const todayClass = d.isToday ? 'today-highlight' : '';
            const hasDataClass = value !== undefined ? 'has-data' : '';
            const display = value !== undefined ? value : '';
            bodyHTML += `<td class="training-cell ${weekendClass} ${todayClass} ${hasDataClass}" onclick="openSlider('${cellKey}', 'rope', '${student.name}', '${d.date}')" title="${student.name || '学员'+(idx+1)} ${d.date} 爬绳"><div class="cell-content">${display}</div></td>`;
        });
        bodyHTML += '</tr>';
        
        // 单杠行
        bodyHTML += '<tr>';
        bodyHTML += `<td class="sticky-col-3" style="color:#1565c0;font-weight:bold;">💪 杠</td>`;
        dates.forEach((d, di) => {
            const cellKey = `${student.id}_${d.date}_bar`;
            const value = trainingData[cellKey];
            const weekendClass = d.isWeekend ? 'weekend' : '';
            const todayClass = d.isToday ? 'today-highlight' : '';
            const hasDataClass = value !== undefined ? 'has-data' : '';
            const display = value !== undefined ? value : '';
            bodyHTML += `<td class="training-cell ${weekendClass} ${todayClass} ${hasDataClass}" onclick="openSlider('${cellKey}', 'bar', '${student.name}', '${d.date}')" title="${student.name || '学员'+(idx+1)} ${d.date} 单杠"><div class="cell-content">${display}</div></td>`;
        });
        bodyHTML += '</tr>';
    });
    
    tbody.innerHTML = bodyHTML;
}

// 格式化时间：秒数 -> 分:秒
function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
}

// 解析时间字符串：分:秒 -> 秒数
function parseTime(timeStr) {
    const parts = timeStr.split(':');
    return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

function openSlider(cellKey, projectType, studentName, date) {
    const project = PROJECTS[projectType];
    const currentValue = trainingData[cellKey];
    
    currentCell = { key: cellKey, type: projectType };
    
    document.getElementById('modalTitle').textContent = project.name;
    document.getElementById('modalInfo').textContent = `${studentName || '未命名学员'} · ${date}`;
    
    const slider = document.getElementById('sliderInput');
    slider.min = project.min;
    slider.max = project.max;
    slider.step = project.step;
    
    // 设置初始值：如果有数据用数据，否则用最小值
    if (currentValue !== undefined) {
        slider.value = currentValue;
    } else {
        slider.value = project.min;
    }
    
    updateSliderDisplay(slider.value);
    
    // 标签
    if (project.format === 'time') {
        document.getElementById('labelMin').textContent = formatTime(project.min);
        document.getElementById('labelMid').textContent = formatTime(Math.floor((project.min + project.max) / 2));
        document.getElementById('labelMax').textContent = formatTime(project.max);
    } else {
        document.getElementById('labelMin').textContent = project.min;
        document.getElementById('labelMid').textContent = (project.min + project.max) / 2;
        document.getElementById('labelMax').textContent = project.max;
    }
    
    // 快捷按钮
    const quickContainer = document.getElementById('quickButtons');
    quickContainer.innerHTML = '';
    project.quickValues.forEach((val, i) => {
        const btn = document.createElement('button');
        btn.className = 'quick-btn';
        btn.textContent = project.quickLabels[i];
        btn.onclick = () => {
            slider.value = val;
            updateSliderDisplay(val);
        };
        quickContainer.appendChild(btn);
    });
    
    document.getElementById('sliderModal').classList.add('active');
}

function updateSliderDisplay(value) {
    const project = PROJECTS[currentCell.type];
    const val = parseFloat(value);
    
    if (project.format === 'time') {
        document.getElementById('displayValue').textContent = formatTime(val);
        document.getElementById('displayUnit').textContent = '';
    } else {
        document.getElementById('displayValue').textContent = val;
        document.getElementById('displayUnit').textContent = project.unit;
    }
}

document.getElementById('sliderInput').addEventListener('input', function(e) {
    updateSliderDisplay(e.target.value);
});

function confirmTrainingData() {
    if (currentCell) {
        const value = parseFloat(document.getElementById('sliderInput').value);
        const project = PROJECTS[currentCell.type];
        
        // 直接保存值（包括0）
        trainingData[currentCell.key] = value;
        saveData();
        renderBody();
        
        let msg;
        if (project.format === 'time') {
            msg = `${project.name}: ${formatTime(value)} 已保存`;
        } else {
            msg = `${project.name}: ${value}${project.unit} 已保存`;
        }
        showToast(msg);
    }
    closeSliderModal();
}

function clearTrainingData() {
    if (currentCell && trainingData[currentCell.key] !== undefined) {
        delete trainingData[currentCell.key];
        saveData();
        renderBody();
        showToast('已清空数据');
    }
    closeSliderModal();
}

function closeSliderModal() {
    document.getElementById('sliderModal').classList.remove('active');
    currentCell = null;
}

function updateName(id, name) {
    const student = students.find(s => s.id === id);
    if (student) { 
        student.name = name.trim(); 
        saveData(); 
        showToast('姓名已保存'); 
    }
}

function addStudent() {
    const newId = Math.max(...students.map(s => s.id), 0) + 1;
    students.push({ id: newId, name: '' });
    saveData(); 
    renderBody(); 
    showToast('已添加新学员');
}

function removeStudent() {
    if (students.length <= 1) { 
        showToast('至少保留一名学员'); 
        return; 
    }
    const lastStudent = students[students.length - 1];
    Object.keys(trainingData).forEach(key => { 
        if (key.startsWith(`${lastStudent.id}_`)) delete trainingData[key]; 
    });
    students.pop(); 
    saveData(); 
    renderBody(); 
    showToast('已删除最后一名学员');
}

function filterStudents() {
    const query = document.getElementById('searchName').value.trim().toLowerCase();
    const rows = document.querySelectorAll('#tableBody > tr');
    rows.forEach((row, idx) => {
        if (idx % 3 === 0) {
            const student = students[Math.floor(idx / 3)];
            const nameMatch = !query || (student.name && student.name.toLowerCase().includes(query));
            row.style.display = nameMatch ? '' : 'none';
            if (rows[idx + 1]) rows[idx + 1].style.display = nameMatch ? '' : 'none';
            if (rows[idx + 2]) rows[idx + 2].style.display = nameMatch ? '' : 'none';
        }
    });
}

function exportJSON() {
    const data = {
        exportTime: new Date().toLocaleString('zh-CN'),
        className: '2026年益东煤矿救护队培训班 - 体能训练',
        period: '2026年5月15日 ～ 2026年8月12日',
        students: students,
        training: trainingData,
        dates: dates.map(d => d.date)
    };
    downloadFile(JSON.stringify(data, null, 2), `益东体能训练_${new Date().toISOString().slice(0,10)}.json`, 'application/json');
    showToast('JSON数据已导出');
}

function exportCSV() {
    let csv = '\uFEFF序号,姓名,项目';
    dates.forEach(d => { csv += `,${d.date}`; });
    csv += '\n';
    
    students.forEach((s, idx) => {
        // 2公里跑
        csv += `${idx+1},${s.name || ''},2公里跑(分:秒)`;
        dates.forEach(d => {
            const val = trainingData[`${s.id}_${d.date}_run`];
            csv += `,${val !== undefined ? formatTime(val) : ''}`;
        });
        csv += '\n';
        
        // 爬绳
        csv += `${idx+1},${s.name || ''},爬绳(米)`;
        dates.forEach(d => {
            const val = trainingData[`${s.id}_${d.date}_rope`];
            csv += `,${val !== undefined ? val : ''}`;
        });
        csv += '\n';
        
        // 单杠
        csv += `${idx+1},${s.name || ''},单杠(个)`;
        dates.forEach(d => {
            const val = trainingData[`${s.id}_${d.date}_bar`];
            csv += `,${val !== undefined ? val : ''}`;
        });
        csv += '\n';
    });
    
    downloadFile(csv, `益东体能训练_${new Date().toISOString().slice(0,10)}.csv`, 'text/csv;charset=utf-8;');
    showToast('CSV表格已导出');
}

function downloadFile(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; 
    a.download = filename; 
    a.click(); 
    URL.revokeObjectURL(url);
}

function clearAllData() {
    if (!confirm('确定要清空所有体能训练数据吗？此操作不可恢复！')) return;
    trainingData = {};
    students = JSON.parse(JSON.stringify(DEFAULT_STUDENTS));
    saveData(); 
    renderBody(); 
    showToast('所有数据已清空');
}

function saveData() {
    localStorage.setItem('yidong_training_students', JSON.stringify(students));
    localStorage.setItem('yidong_training_data', JSON.stringify(trainingData));
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

// 点击弹窗外部关闭
document.getElementById('sliderModal').addEventListener('click', function(e) { 
    if (e.target === this) closeSliderModal(); 
});
document.addEventListener('keydown', function(e) { 
    if (e.key === 'Escape') closeSliderModal(); 
});
